# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: digiplus-context-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digiplus-db
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard; never committed
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENV
        value: production

databases:
  - name: digiplus-db
    plan: free
